name: Android Mobile CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APPIUM_VERSION: "3.7.0"
  UIAUTOMATOR2_VERSION: "8.6.1"

jobs:

  android:
    name: Android ${{ matrix.gate }} Gate

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - gate: Smoke
            profile: smoke

          - gate: Regression
            profile: regression

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Appium
        run: |
          npm install --global "appium@${APPIUM_VERSION}"

          appium driver install \
            "uiautomator2@${UIAUTOMATOR2_VERSION}"

          echo
          echo "=== APPIUM ==="
          appium --version

          echo
          echo "=== DRIVERS ==="
          appium driver list --installed

      - name: Enable KVM
        run: |
          echo \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android ${{ matrix.gate }} Gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64

          profile: pixel_6

          cores: 2
          ram-size: 2048

          emulator-port: 5554
          emulator-boot-timeout: 600

          disable-animations: true

          emulator-options: >-
            -no-window
            -no-snapshot
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
            -camera-back none
            -camera-front none

          script: |
            echo "=========================================="
            echo " ANDROID ${{ matrix.gate }} GATE"
            echo "=========================================="

            echo
            echo "=== DEVICE ==="
            adb devices -l

            echo
            echo "=== BOOTSTRAP TEST APP ==="
            ./scripts/bootstrap-android.sh

            echo
            echo "=== START APPIUM ==="

            rm -f appium-server.log

            nohup appium \
              --address 127.0.0.1 \
              --port 4723 \
              > appium-server.log 2>&1 &

            APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            echo
            echo "=== WAITING FOR APPIUM ==="

            READY="false"

            for i in $(seq 1 45); do

              if curl -fsS \
                http://127.0.0.1:4723/status \
                >/dev/null 2>&1
              then
                READY="true"
                echo "OK: Appium Server ready."
                break
              fi

              echo "Waiting for Appium... $i/45"
              sleep 1
            done

            if [ "$READY" != "true" ]; then
              echo
              echo "ERROR: Appium Server did not start."
              cat appium-server.log || true
              exit 1
            fi

            echo
            echo "=== APPIUM STATUS ==="

            curl -fsS \
              http://127.0.0.1:4723/status

            echo
            echo
            echo "=== MAVEN PROFILE ==="
            echo "${{ matrix.profile }}"

            echo
            echo "=== RUN TESTS ==="

            mvn -B -ntp test \
              -P${{ matrix.profile }}

            echo
            echo "=========================================="
            echo " ANDROID ${{ matrix.gate }} GATE PASSED"
            echo "=========================================="

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.profile }}-evidence
          path: |
            target/surefire-reports/
            target/evidence/
            appium-server.log
          if-no-files-found: ignore
          retention-days: 14
